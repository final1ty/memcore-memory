[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore-memory"
version = "1.0.0"
description = "Local-first encrypted memory for AI agents: AES-256-GCM SQLite store, 4-tier Ebbinghaus decay, hybrid BM25/vector retrieval, MCP server and REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kovács-Dobos Ádám", email = "kovacsdobosadam@gmail.com"}]
maintainers = [{name = "Kovács-Dobos Ádám", email = "kovacsdobosadam@gmail.com"}]
keywords = ["memory", "ai-agents", "mcp", "ebbinghaus", "encryption", "sqlite", "pgvector"]
# cryptography>=44: the Argon2id KDF that wraps the master key first shipped in 44, and
# 42/43 fail at `import memcore_memory`. argon2-cffi is not listed because nothing
# imports it. sqlalchemy is only for the Postgres backend and comes with that extra.
dependencies = [
    "cryptography>=44.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.20",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    # mcp/server.py passes on_list_tools/on_call_tool to Server(); 1.x registered
    # handlers with decorators and fails there with a TypeError.
    "mcp>=2.2; python_version >= '3.10'",
    # mcp/server.py validates tool arguments with it. mcp pulls it in today, but only
    # as its own dependency; the REST API and MCP server fail at import without it.
    "jsonschema>=4.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6", "torch>=2.2", "transformers>=4.38"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3.2", "sqlalchemy[asyncio]>=2.0"]
all = ["sentence-transformers>=2.6", "torch>=2.2", "transformers>=4.38", "asyncpg>=0.29", "pgvector>=0.3.2", "sqlalchemy[asyncio]>=2.0", "hnswlib>=0.8"]
# Kept as an alias so existing `pip install memcore-memory[excellent]` lines still resolve.
excellent = ["memcore-memory[all]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.3", "bandit>=1.7"]

[project.urls]
Homepage = "https://github.com/final1ty/memcore-memory"
Repository = "https://github.com/final1ty/memcore-memory"
Issues = "https://github.com/final1ty/memcore-memory/issues"

[project.scripts]
memcore = "memcore_memory.cli.main:app"
memcore-memory = "memcore_memory.cli.main:app"
mnem = "memcore_memory.cli.main:app"
mnemosyne = "memcore_memory.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
