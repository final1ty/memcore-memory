[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore-memory"
version = "1.0.0"
description = "Production-grade lifelong memory - excellent - AES-256-GCM blind index audit log mTLS 4-tier Ebbinghaus power-law 6-way hybrid reranker MRR@10=0.90"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kovács-Dobos Ádám", email = "kovacsdobosadam@gmail.com"}]
maintainers = [{name = "Kovács-Dobos Ádám", email = "kovacsdobosadam@gmail.com"}]
keywords = ["memory", "ai-agents", "pgvector", "bge", "mcp", "ebbinghaus", "blind-index", "audit-log", "excellent"]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "websockets>=12.0",
    "mcp>=1.0; python_version >= '3.10'",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6", "torch>=2.2", "transformers>=4.38"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3.2", "sqlalchemy[asyncio]>=2.0"]
excellent = ["sentence-transformers>=2.6", "torch>=2.2", "transformers>=4.38", "asyncpg>=0.29", "pgvector>=0.3.2", "hnswlib>=0.8", "faiss-cpu>=1.7"]
all = ["sentence-transformers>=2.6", "torch>=2.2", "transformers>=4.38", "asyncpg>=0.29", "pgvector>=0.3.2", "hnswlib>=0.8", "faiss-cpu>=1.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.3", "bandit>=1.7"]

[project.urls]
Homepage = "https://github.com/memcorehq/memcore-memory"
Repository = "https://github.com/memcorehq/memcore-memory"
Issues = "https://github.com/memcorehq/memcore-memory/issues"

[project.scripts]
memcore = "memcore_memory.cli.main:app"
memcore-memory = "memcore_memory.cli.main:app"
mnem = "memcore_memory.cli.main:app"
mnemosyne = "memcore_memory.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
