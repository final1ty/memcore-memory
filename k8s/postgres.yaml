apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-pgvector
  namespace: mnemosyne
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pgvector
  template:
    metadata:
      labels:
        app: postgres-pgvector
    spec:
      containers:
      - name: postgres
        # ankane/pgvector is deprecated upstream, and :latest made the server and
        # extension version change underneath an existing data directory.
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: mnemosyne
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mnemosyne-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: mnemosyne
        # A subdirectory of the mount: on storage classes that create lost+found,
        # initdb refuses a non-empty mount root. (A cluster that had initialised at
        # the root would start empty here; move its files into pgdata/ first.)
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "mnemosyne"]
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "mnemosyne"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mnemosyne
spec:
  selector:
    app: postgres-pgvector
  ports:
  - port: 5432
