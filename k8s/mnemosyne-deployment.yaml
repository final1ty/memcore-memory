
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemosyne-api
  namespace: mnemosyne
  labels:
    app: mnemosyne
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mnemosyne
  template:
    metadata:
      labels:
        app: mnemosyne
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: api
        image: mnemosyne-memory:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 7742
          name: p2p
        env:
        - name: MNEM_BACKEND
          value: postgres
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mnemosyne-secrets
              key: database-url
        - name: MNEM_EMBEDDING_PROVIDER
          value: bge-small
        - name: MNEM_EMBEDDING_DIM
          value: "384"
        - name: MNEM_ENCRYPTION_ENABLED
          value: "true"
        - name: MNEM_DATA_DIR
          value: /data
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        - name: keys
          mountPath: /keys
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mnemosyne-data
      - name: keys
        secret:
          secretName: mnemosyne-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: mnemosyne-api
  namespace: mnemosyne
spec:
  selector:
    app: mnemosyne
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: p2p
    port: 7742
    targetPort: 7742
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mnemosyne-hpa
  namespace: mnemosyne
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mnemosyne-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
