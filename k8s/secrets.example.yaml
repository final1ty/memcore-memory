# Example only - not applied by kustomization.yaml, and k8s/secrets.yaml is gitignored
# so a filled-in copy cannot be committed by accident. Prefer creating the Secret
# directly, which never puts the values in a file:
#
#   kubectl -n mnemosyne create secret generic mnemosyne-secrets \
#     --from-literal=postgres-password="$(openssl rand -hex 24)" \
#     --from-file=master.key=./master.key
#
# postgres-password: the postgres image only reads it when it initialises an EMPTY
#   data directory. After the first start it is baked into the pgdata volume, and
#   changing the Secret alone breaks the DSN - run ALTER USER as well. Keep it
#   URL-safe (hex is), because the Deployment splices it into MNEM_DATABASE_URL.
#
# master.key: mounted as /keys/master.key, and either of the two formats KeyManager
#   reads. A RAW key is exactly 32 bytes; `data:` values are base64-decoded at mount
#   time, so put the base64 of those 32 bytes there (`head -c32 /dev/urandom | base64
#   -w0` for a brand-new store). A password-wrapped key is the JSON file written by
#   `memcore` with a password (salt/nonce/ct); use --from-file=master.key=<that file>
#   and set master-password below, or the pod fails with MasterPasswordRequired.
#   Anything else is refused with MasterKeyUnreadable. MNEM_ENV=prod only stops the
#   pod from CREATING an unprotected key; a raw key supplied here still loads. Every row in Postgres is encrypted under this
#   key: back it up outside the cluster, and when moving an existing deployment, seed
#   it from that deployment's current master.key - a fresh key makes every existing
#   row fail with InvalidTag. Kubernetes stores it unencrypted in etcd unless
#   encryption at rest is configured.
#
# master-password (optional): the password a wrapped master.key was created with,
#   exposed as MNEM_MASTER_PASSWORD. Add it with
#   --from-literal=master-password=... . Not needed for a raw key.
#
# api-key (optional): when present, every REST route except /health and /livez needs
#   "Authorization: Bearer <key>". The Service is reachable from the whole cluster.
apiVersion: v1
kind: Secret
metadata:
  name: mnemosyne-secrets
  namespace: mnemosyne
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_HEX_PASSWORD"
  # api-key: "CHANGE_ME"
  # master-password: "CHANGE_ME"   # only for a password-wrapped master.key
data:
  master.key: "CHANGE_ME_BASE64_OF_EXACTLY_32_BYTES"
