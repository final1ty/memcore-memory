
apiVersion: v1
kind: Secret
metadata:
  name: mnemosyne-secrets
  namespace: mnemosyne
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_STRONG_PASSWORD"
  database-url: "postgresql+asyncpg://mnemosyne:CHANGE_ME_STRONG_PASSWORD@postgres:5432/mnemosyne"
  master-key-b64: "CHANGE_ME_BASE64_32BYTES"
